name: Build and Push to GHCR

on:
  push:
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]+'
  schedule:
    # Refresh base image patches on the 1st and 15th. Not weekly: a consumer
    # that waits 7 days before adopting a new :latest would never see a
    # weekly build old enough. GitHub disables this schedule after 60 days
    # without a commit; `gh workflow enable build.yaml` resumes it.
    - cron: '0 6 1,15 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Determine target tag
      id: target
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          tag=${GITHUB_REF#refs/tags/}
        else
          tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          git checkout "$tag"
        fi
        echo "tag=$tag" >> $GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: tags
      uses: docker/metadata-action@v6
      with:
        context: git   # labels name the checked-out tag's commit, also on scheduled runs
        images: ghcr.io/dj-mcculloch/openvpn-client
        tags: |
          type=semver,pattern={{version}},value=${{ steps.target.outputs.tag }}
          type=semver,pattern={{major}}.{{minor}},value=${{ steps.target.outputs.tag }}
          type=semver,pattern={{major}},value=${{ steps.target.outputs.tag }},enable=${{ !startsWith(steps.target.outputs.tag, 'v0.') }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./build
        platforms: linux/amd64,linux/arm64
        labels: ${{ steps.tags.outputs.labels }}
        tags: ${{ steps.tags.outputs.tags }}
        push: true

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag=${GITHUB_REF#refs/tags/}
        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "Release $tag already exists; skipping."
        else
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --generate-notes
        fi
