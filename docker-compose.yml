services:
  openvpn-client:
    image: ghcr.io/dj-mcculloch/openvpn-client:latest
    container_name: openvpn-client
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # ALLOWED_SUBNETS: 192.168.1.0/24   # your LAN, to reach the apps from it
      AUTH_SECRET: /config/credentials.txt
      DEBUG: false
      KILLSWITCH: true
    volumes:
      - ./local:/config
    restart: unless-stopped
